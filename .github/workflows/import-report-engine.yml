name: Import pinned reporting engine
on:
  push:
    paths: ['.github/workflows/import-report-engine.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import original source without production resources or data
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=ed55b4409d7caf668b4cb62c8a27fc79a8d2ce68
          test ! -d vendor/proinspect
          git clone --no-checkout https://github.com/info-rbp/Property-Report-Tool.git /tmp/report-engine
          git -C /tmp/report-engine checkout --detach "$SOURCE"
          mkdir -p vendor/proinspect
          for p in src scripts docs public package.json bun.lock tsconfig.json tsconfig.worker.json index.html vite.config.ts README.md DATA_RETENTION.md; do
            cp -R "/tmp/report-engine/$p" vendor/proinspect/
          done
          rm -f vendor/proinspect/public/sw.js vendor/proinspect/public/manifest.webmanifest
          printf '%s\n' '{"repository":"info-rbp/Property-Report-Tool","commit":"ed55b4409d7caf668b4cb62c8a27fc79a8d2ce68","purpose":"source provenance; original worker and production configuration are not deployed"}' > vendor/proinspect/PROVENANCE.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/proinspect
          git commit -m 'Vendor pinned reporting UI and deterministic renderer; exclude production worker resources'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-report-engine-source
          path: vendor/proinspect/
          retention-days: 3
          include-hidden-files: true

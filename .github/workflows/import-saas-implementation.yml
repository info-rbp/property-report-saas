name: Import and verify SaaS implementation
on:
  push:
    paths: ['.github/workflows/import-saas-implementation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify and unpack prepared source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, pathlib, shutil, tarfile
          root = pathlib.Path.cwd()
          chunks = [(root / '.transfer' / f'{i:02}.b64').read_text().strip() for i in range(1,11)]
          for i, text in enumerate(chunks, 1):
              print(f'Chunk {i:02}: {len(text)} characters; SHA256 {hashlib.sha256(text.encode()).hexdigest()}')
          text = ''.join(chunks)
          assert len(text) == 152272, 'Source transfer length mismatch'
          data = base64.b64decode(text, validate=True)
          assert len(data) == 114204, 'Source archive size mismatch'
          assert hashlib.sha256(data).hexdigest() == '21a817b3a650f8547a81e99dcf99e9511c34b8484af6dcac0ac843743d03fb04', 'Source archive checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              members = archive.getmembers()
              assert len(members) == 79, 'Unexpected source file count'
              assert sum(m.size for m in members) < 5000000
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in ('.git', '.transfer', 'node_modules', 'vendor')
                  destination = root / path
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.extractfile(member).read())
          shutil.rmtree(root / '.transfer')
          print('Verified 79 source files; original vendor snapshot retained.')
          PY
      - name: Publish implementation without deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github'
          git commit -m 'Implement multi-tenant reporting SaaS, trusted PDFs, signing, offline workflow and recovery controls'
          git push origin HEAD:main
          echo "Implemented commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check
      - run: npm run licenses
      - name: Regression tests including all report templates
        run: PDF_OUTPUT_DIR=artifacts/pdfs npm test
      - name: Validate Worker types and deployment bundle
        run: |
          npx wrangler types
          npx wrangler deploy --dry-run --outdir artifacts/worker
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Cloudflare local-runtime and browser acceptance
        run: npm run test:runtime
      - name: Check statutory text and PDF output
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          node scripts/verify-pdf-output.mjs
      - name: Confirm unapproved paid launch remains blocked
        run: |
          if npm run release:check; then
            echo 'Unexpected production approval in development candidate.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saas-implementation-verification
          path: artifacts/
          retention-days: 7
# This workflow imports verified source only. It does not deploy or charge customers.

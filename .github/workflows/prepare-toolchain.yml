name: Prepare pinned development toolchain
on:
  push:
    paths: ['.github/workflows/prepare-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve and pin current published dependencies
        run: |
          npm install --save-exact react@latest react-dom@latest jspdf@latest heic-to@1.5.2 lucide-react@latest stripe@latest pdf-lib@latest
          npm install --save-dev --save-exact vite@latest @vitejs/plugin-react@latest @tailwindcss/vite@latest tailwindcss@latest typescript@latest esbuild@latest @types/react@latest @types/react-dom@latest @types/node@22 wrangler@latest @cloudflare/workers-types@latest @playwright/test@latest
          npm audit --json > dependency-audit.json || true
          npm ls --all --json > dependency-tree.json
      - name: Commit dependency resolution only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m 'Pin published SaaS dependencies and lock dependency tree'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Prepare local verification toolchain artifact
        run: tar -czf /tmp/saas-toolchain.tar.gz node_modules package.json package-lock.json dependency-audit.json dependency-tree.json
      - uses: actions/upload-artifact@v4
        with:
          name: saas-development-toolchain
          path: /tmp/saas-toolchain.tar.gz
          retention-days: 1

name: Verify SaaS candidate
on:
  push:
    branches: [main]
    paths-ignore: ['.transfer/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check
      - run: npm run licenses
      - name: Contracts, rendering, storage and signing regression
        run: PDF_OUTPUT_DIR=artifacts/pdfs npm test
      - name: Validate generated runtime types and deployment bundle
        run: |
          npx wrangler types
          npx wrangler deploy --dry-run --outdir artifacts/worker
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Real local Workers runtime and Chromium offline acceptance
        run: npm run test:runtime
      - name: Verify statutory content in generated PDFs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          node scripts/verify-pdf-output.mjs
      - name: Confirm unapproved live launch is blocked
        run: |
          if npm run release:check; then
            echo 'Unexpected production approval in the staging candidate.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-verification
          path: artifacts/
          retention-days: 7
# No production deployment or live-provider credentials in this workflow.
